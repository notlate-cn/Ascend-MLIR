<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1480" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <style>
      .phase    { fill:#e3f2fd; stroke:#1565c0; stroke-width:2; }
      .phaseTxt { font-size:18px; font-weight:700; fill:#0d47a1; }
      .tool     { fill:#fff3e0; stroke:#ef6c00; stroke-width:1.5; }
      .toolTxt  { font-size:13px; font-weight:600; fill:#bf360c; font-family:monospace; }
      .file     { fill:#f1f8e9; stroke:#558b2f; stroke-width:1.2; }
      .fileTxt  { font-size:12px; fill:#33691e; font-family:monospace; }
      .note     { font-size:11px; fill:#555; font-style:italic; }
      .lib      { fill:#fce4ec; stroke:#c2185b; stroke-width:1.2; }
      .libTxt   { font-size:11px; fill:#880e4f; font-family:monospace; }
      .head     { font-size:24px; font-weight:800; fill:#212121; }
      .sub      { font-size:14px; fill:#444; }
      .arrow    { stroke:#444; stroke-width:1.6; fill:none; }
      .arrowBlue{ stroke:#1565c0; stroke-width:1.8; fill:none; }
      .arrowGreen{ stroke:#2e7d32; stroke-width:1.6; fill:none; stroke-dasharray:4,3; }
      .loop     { stroke:#6a1b9a; stroke-width:1.6; fill:none; stroke-dasharray:6,3; }
    </style>
  </defs>

  <text x="640" y="40" text-anchor="middle" class="head">Network Runner — Mixed AscendC + aclnn Compile Flow</text>
  <text x="640" y="64" text-anchor="middle" class="sub">examples/mixed-attn-e2e  →  python/network_runner.py  (5 phases)</text>

  <!-- ============ INPUT ============ -->
  <rect x="40" y="100" width="280" height="170" rx="8" class="file"/>
  <text x="180" y="124" text-anchor="middle" class="fileTxt" font-weight="700">Input dir: examples/mixed-attn-e2e/</text>
  <text x="60" y="150" class="fileTxt">network.mlir       @model call seq</text>
  <text x="60" y="170" class="fileTxt">kernel_group0.mlir linalg.generic</text>
  <text x="60" y="190" class="fileTxt">gen_inputs.py      → q/k/v/...npy</text>
  <text x="60" y="210" class="fileTxt">                     expected.npy</text>
  <text x="60" y="234" class="note">network.mlir: @kernel_group0 (ascendc)</text>
  <text x="60" y="250" class="note">           +  @__aclnn_flash_attention</text>

  <!-- ============ PHASE 1 ============ -->
  <rect x="380" y="100" width="860" height="170" rx="10" class="phase"/>
  <text x="400" y="128" class="phaseTxt">Phase 1 — outline / emit network.json</text>

  <rect x="400" y="148" width="260" height="50" rx="6" class="tool"/>
  <text x="530" y="170" text-anchor="middle" class="toolTxt">afir-opt</text>
  <text x="530" y="188" text-anchor="middle" class="toolTxt">--emit-network-json</text>

  <rect x="700" y="148" width="220" height="50" rx="6" class="file"/>
  <text x="810" y="170" text-anchor="middle" class="fileTxt">$WORK/groups/*.mlir</text>
  <text x="810" y="186" text-anchor="middle" class="fileTxt">network.json</text>

  <rect x="960" y="148" width="260" height="50" rx="6" class="lib"/>
  <text x="1090" y="168" text-anchor="middle" class="libTxt">EmitNetworkJsonPass.cpp</text>
  <text x="1090" y="184" text-anchor="middle" class="libTxt">NetworkJsonEmitter.cpp</text>

  <text x="400" y="225" class="note">Hand-written branch: copy *.mlir → groups/, emit network.json schema</text>
  <text x="400" y="244" class="note">{function, inputs[], kernels[{id, kind: ascendc|aclnn, file?, op?, args[]}], outputs[]}</text>
  <text x="400" y="262" class="note">--input-linalg branch instead runs --linalg-fold-unit-extent-dims + --vector-plan-group-{analysis,outline}</text>

  <line x1="320" y1="180" x2="376" y2="180" class="arrow" marker-end="url(#arr)"/>
  <line x1="660" y1="173" x2="696" y2="173" class="arrow" marker-end="url(#arr)"/>

  <!-- arrow phase 1 -> 2 -->
  <line x1="810" y1="270" x2="810" y2="295" class="arrowBlue" marker-end="url(#arrBlue)"/>

  <!-- ============ PHASE 2 ============ -->
  <rect x="40" y="300" width="1200" height="220" rx="10" class="phase"/>
  <text x="60" y="328" class="phaseTxt">Phase 2 — per ascendc kernel: codegen + compile</text>

  <rect x="60" y="350" width="160" height="60" rx="6" class="file"/>
  <text x="140" y="375" text-anchor="middle" class="fileTxt">groups/</text>
  <text x="140" y="392" text-anchor="middle" class="fileTxt">kernel_group0.mlir</text>

  <rect x="260" y="350" width="180" height="60" rx="6" class="tool"/>
  <text x="350" y="375" text-anchor="middle" class="toolTxt">afir-opt</text>
  <text x="350" y="393" text-anchor="middle" class="toolTxt">--vector-plan-codegen</text>

  <rect x="480" y="350" width="180" height="60" rx="6" class="file"/>
  <text x="570" y="375" text-anchor="middle" class="fileTxt">kernel_group0_</text>
  <text x="570" y="392" text-anchor="middle" class="fileTxt">lowered.mlir</text>

  <rect x="700" y="350" width="200" height="60" rx="6" class="tool"/>
  <text x="800" y="372" text-anchor="middle" class="toolTxt">afir-translate</text>
  <text x="800" y="390" text-anchor="middle" class="toolTxt">-mlir-to-cann</text>
  <text x="800" y="406" text-anchor="middle" class="toolTxt">--tiling-space-out</text>

  <rect x="940" y="340" width="280" height="80" rx="6" class="file"/>
  <text x="1080" y="362" text-anchor="middle" class="fileTxt">kernel_group0.cpp</text>
  <text x="1080" y="380" text-anchor="middle" class="fileTxt">kernel_group0_space.json</text>
  <text x="1080" y="402" text-anchor="middle" class="note">tiling params + block_dim_expr + shape_keys</text>

  <line x1="220" y1="380" x2="256" y2="380" class="arrow" marker-end="url(#arr)"/>
  <line x1="440" y1="380" x2="476" y2="380" class="arrow" marker-end="url(#arr)"/>
  <line x1="660" y1="380" x2="696" y2="380" class="arrow" marker-end="url(#arr)"/>
  <line x1="900" y1="380" x2="936" y2="380" class="arrow" marker-end="url(#arr)"/>

  <rect x="260" y="440" width="200" height="60" rx="6" class="tool"/>
  <text x="360" y="462" text-anchor="middle" class="toolTxt">runtime-session</text>
  <text x="360" y="480" text-anchor="middle" class="toolTxt">--kernel-kind vec</text>

  <rect x="500" y="440" width="320" height="60" rx="6" class="file"/>
  <text x="660" y="462" text-anchor="middle" class="fileTxt">$WORK/artifacts/kernel_group0/</text>
  <text x="660" y="480" text-anchor="middle" class="fileTxt">kernel_group0.bin + manifest.json</text>

  <text x="860" y="465" class="note">camodel-compiled device binary</text>
  <text x="860" y="483" class="note">aclnn kernels: nothing to do here</text>

  <line x1="1080" y1="420" x2="1080" y2="436" class="arrow"/>
  <line x1="1080" y1="436" x2="360" y2="436" class="arrow"/>
  <line x1="360" y1="436" x2="360" y2="438" class="arrow" marker-end="url(#arr)"/>
  <line x1="460" y1="470" x2="496" y2="470" class="arrow" marker-end="url(#arr)"/>

  <!-- arrow phase 2 -> 3 -->
  <line x1="660" y1="520" x2="660" y2="555" class="arrowBlue" marker-end="url(#arrBlue)"/>

  <!-- ============ PHASE 3 ============ -->
  <rect x="40" y="560" width="1200" height="280" rx="10" class="phase"/>
  <text x="60" y="588" class="phaseTxt">Phase 3 — default tilings → build → run → dump intermediates</text>

  <rect x="60" y="608" width="220" height="76" rx="6" class="file"/>
  <text x="170" y="630" text-anchor="middle" class="fileTxt">tilings_default.json</text>
  <text x="170" y="650" text-anchor="middle" class="note">pick values[-1] (largest XBLOCK)</text>
  <text x="170" y="668" text-anchor="middle" class="note">resolve shape_keys from input npy</text>

  <rect x="320" y="608" width="220" height="76" rx="6" class="tool"/>
  <text x="430" y="635" text-anchor="middle" class="toolTxt">aclnn-backend</text>
  <text x="430" y="654" text-anchor="middle" class="toolTxt">--tilings ...</text>
  <text x="430" y="672" text-anchor="middle" class="toolTxt">--kernel-binaries ...</text>

  <rect x="580" y="608" width="200" height="76" rx="6" class="file"/>
  <text x="680" y="635" text-anchor="middle" class="fileTxt">network_host_</text>
  <text x="680" y="653" text-anchor="middle" class="fileTxt">default.cpp</text>
  <text x="680" y="675" text-anchor="middle" class="note">network() function</text>

  <rect x="820" y="608" width="200" height="76" rx="6" class="tool"/>
  <text x="920" y="635" text-anchor="middle" class="toolTxt">link_host (g++)</text>
  <text x="920" y="654" text-anchor="middle" class="toolTxt">+ harness.cpp</text>
  <text x="920" y="672" text-anchor="middle" class="toolTxt">+ libAscendCRuntime.a</text>

  <rect x="1060" y="608" width="160" height="76" rx="6" class="file"/>
  <text x="1140" y="635" text-anchor="middle" class="fileTxt">network_test_</text>
  <text x="1140" y="653" text-anchor="middle" class="fileTxt">default</text>
  <text x="1140" y="675" text-anchor="middle" class="note">binary</text>

  <line x1="280" y1="646" x2="316" y2="646" class="arrow" marker-end="url(#arr)"/>
  <line x1="540" y1="646" x2="576" y2="646" class="arrow" marker-end="url(#arr)"/>
  <line x1="780" y1="646" x2="816" y2="646" class="arrow" marker-end="url(#arr)"/>
  <line x1="1020" y1="646" x2="1056" y2="646" class="arrow" marker-end="url(#arr)"/>

  <rect x="320" y="710" width="240" height="60" rx="6" class="tool"/>
  <text x="440" y="732" text-anchor="middle" class="toolTxt">./network_test_default</text>
  <text x="440" y="750" text-anchor="middle" class="toolTxt">--dump-intermediates DIR</text>

  <rect x="600" y="710" width="280" height="60" rx="6" class="file"/>
  <text x="740" y="732" text-anchor="middle" class="fileTxt">intermediates_default/</text>
  <text x="740" y="750" text-anchor="middle" class="fileTxt">kernel_group0_in_*.npy / out_*.npy</text>

  <rect x="920" y="710" width="300" height="60" rx="6" class="lib"/>
  <text x="1070" y="731" text-anchor="middle" class="libTxt">HostLaunchHelper.cpp → ExecutionSession::run</text>
  <text x="1070" y="748" text-anchor="middle" class="libTxt">AclnnOps.cpp (host-mode CPU ref)</text>

  <line x1="1140" y1="684" x2="1140" y2="700" class="arrow"/>
  <line x1="1140" y1="700" x2="440" y2="700" class="arrow"/>
  <line x1="440" y1="700" x2="440" y2="708" class="arrow" marker-end="url(#arr)"/>
  <line x1="560" y1="740" x2="596" y2="740" class="arrow" marker-end="url(#arr)"/>

  <text x="60" y="800" class="note">Why dump intermediates? Phase 4 needs per-kernel inputs (--inputs) AND a known-good output (--expected) to score tiling configs.</text>
  <text x="60" y="820" class="note">Use largest XBLOCK as default so block_dim stays small (camodel only really runs ≤ 32 cores; bigger → silently writes zeros).</text>

  <!-- arrow phase 3 -> 4 -->
  <line x1="740" y1="840" x2="740" y2="875" class="arrowBlue" marker-end="url(#arrBlue)"/>

  <!-- ============ PHASE 4 ============ -->
  <rect x="40" y="880" width="1200" height="200" rx="10" class="phase"/>
  <text x="60" y="908" class="phaseTxt">Phase 4 — per ascendc kernel: autotune</text>

  <rect x="60" y="930" width="240" height="120" rx="6" class="file"/>
  <text x="180" y="954" text-anchor="middle" class="fileTxt">_space.json</text>
  <text x="180" y="972" text-anchor="middle" class="fileTxt">.cpp source</text>
  <text x="180" y="990" text-anchor="middle" class="fileTxt">in_*.npy</text>
  <text x="180" y="1008" text-anchor="middle" class="fileTxt">out_0.npy (expected)</text>
  <text x="180" y="1030" text-anchor="middle" class="note">--shape arg0_dim0=...</text>

  <rect x="340" y="930" width="280" height="120" rx="6" class="tool"/>
  <text x="480" y="958" text-anchor="middle" class="toolTxt">autotuner</text>
  <text x="480" y="982" text-anchor="middle" class="note">cartesian product of values[]</text>
  <text x="480" y="1000" text-anchor="middle" class="note">eval block_dim_expr</text>
  <text x="480" y="1018" text-anchor="middle" class="note">prune block_dim &gt; 32</text>
  <text x="480" y="1036" text-anchor="middle" class="note">compile + run + compare</text>

  <rect x="660" y="930" width="220" height="120" rx="6" class="file"/>
  <text x="770" y="958" text-anchor="middle" class="fileTxt">kernel_group0_</text>
  <text x="770" y="976" text-anchor="middle" class="fileTxt">best.json</text>
  <text x="770" y="1000" text-anchor="middle" class="note">best {config, block_dim}</text>
  <text x="770" y="1020" text-anchor="middle" class="note">+ profile dir</text>

  <rect x="920" y="950" width="300" height="80" rx="6" class="file"/>
  <text x="1070" y="982" text-anchor="middle" class="fileTxt">tilings_best.json</text>
  <text x="1070" y="1004" text-anchor="middle" class="note">aggregated across kernels</text>

  <line x1="300" y1="990" x2="336" y2="990" class="arrow" marker-end="url(#arr)"/>
  <line x1="620" y1="990" x2="656" y2="990" class="arrow" marker-end="url(#arr)"/>
  <line x1="880" y1="990" x2="916" y2="990" class="arrow" marker-end="url(#arr)"/>

  <!-- arrow phase 4 -> 5 -->
  <line x1="1070" y1="1080" x2="1070" y2="1115" class="arrowBlue" marker-end="url(#arrBlue)"/>

  <!-- ============ PHASE 5 ============ -->
  <rect x="40" y="1120" width="1200" height="240" rx="10" class="phase"/>
  <text x="60" y="1148" class="phaseTxt">Phase 5 — best tilings → final build → run → verify</text>

  <rect x="60" y="1170" width="220" height="60" rx="6" class="file"/>
  <text x="170" y="1194" text-anchor="middle" class="fileTxt">tilings_best.json</text>
  <text x="170" y="1214" text-anchor="middle" class="note">from phase 4</text>

  <rect x="320" y="1170" width="180" height="60" rx="6" class="tool"/>
  <text x="410" y="1194" text-anchor="middle" class="toolTxt">aclnn-backend</text>
  <text x="410" y="1214" text-anchor="middle" class="toolTxt">(re-emit)</text>

  <rect x="540" y="1170" width="180" height="60" rx="6" class="file"/>
  <text x="630" y="1194" text-anchor="middle" class="fileTxt">network_host.cpp</text>

  <rect x="760" y="1170" width="160" height="60" rx="6" class="tool"/>
  <text x="840" y="1194" text-anchor="middle" class="toolTxt">link_host (g++)</text>

  <rect x="960" y="1170" width="160" height="60" rx="6" class="file"/>
  <text x="1040" y="1194" text-anchor="middle" class="fileTxt">network_test</text>

  <line x1="280" y1="1200" x2="316" y2="1200" class="arrow" marker-end="url(#arr)"/>
  <line x1="500" y1="1200" x2="536" y2="1200" class="arrow" marker-end="url(#arr)"/>
  <line x1="720" y1="1200" x2="756" y2="1200" class="arrow" marker-end="url(#arr)"/>
  <line x1="920" y1="1200" x2="956" y2="1200" class="arrow" marker-end="url(#arr)"/>

  <rect x="320" y="1250" width="220" height="60" rx="6" class="tool"/>
  <text x="430" y="1274" text-anchor="middle" class="toolTxt">./network_test</text>
  <text x="430" y="1292" text-anchor="middle" class="toolTxt">--input ... --output ...</text>

  <rect x="580" y="1250" width="200" height="60" rx="6" class="file"/>
  <text x="680" y="1274" text-anchor="middle" class="fileTxt">outputs/out0.npy</text>

  <rect x="820" y="1250" width="200" height="60" rx="6" class="tool"/>
  <text x="920" y="1272" text-anchor="middle" class="toolTxt">np.allclose</text>
  <text x="920" y="1290" text-anchor="middle" class="toolTxt">vs expected.npy</text>

  <rect x="1060" y="1250" width="160" height="60" rx="6" class="file"/>
  <text x="1140" y="1276" text-anchor="middle" class="fileTxt" font-weight="700" fill="#2e7d32">PASS / FAIL</text>
  <text x="1140" y="1294" text-anchor="middle" class="note">max_diff reported</text>

  <line x1="1040" y1="1230" x2="1040" y2="1240" class="arrow"/>
  <line x1="1040" y1="1240" x2="430" y2="1240" class="arrow"/>
  <line x1="430" y1="1240" x2="430" y2="1248" class="arrow" marker-end="url(#arr)"/>
  <line x1="540" y1="1280" x2="576" y2="1280" class="arrow" marker-end="url(#arr)"/>
  <line x1="780" y1="1280" x2="816" y2="1280" class="arrow" marker-end="url(#arr)"/>
  <line x1="1020" y1="1280" x2="1056" y2="1280" class="arrow" marker-end="url(#arr)"/>

  <text x="60" y="1340" class="note">Same wiring as phase 3, swap tilings_default.json → tilings_best.json. e2e demo: max_diff = 0.0001221  PASS.</text>

